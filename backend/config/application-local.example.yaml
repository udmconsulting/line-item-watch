# Copy this file to application-local.yaml and keep the copy local and mode 600.
# Never place real credentials or encryption keys in this tracked template.
spring:
  config:
    activate:
      on-profile: local

hubspot:
  oauth:
    client-id: __SET_LOCAL_CLIENT_ID__
    client-secret: __SET_LOCAL_CLIENT_SECRET__
    redirect-uri: http://localhost:8080/integrations/hubspot/oauth/callback
  webhook:
    enabled: false
    # When enabled, set an externally reachable HTTPS URI ending in:
    # /integrations/hubspot/webhooks
    # Supply public-uri through HUBSPOT_WEBHOOK_PUBLIC_URI.
  ui-extension:
    enabled: false
    # When enabled, supply the exact public HTTPS origin and numeric HubSpot app ID
    # through HUBSPOT_UI_EXTENSION_PUBLIC_BASE_URI and HUBSPOT_UI_EXTENSION_APP_ID.
  credentials:
    key-id: local-acceptance-2
    encryption-key: __SET_LOCAL_BASE64_AES_256_KEY__

line-item-watch:
  audit:
    cursor:
      # Required when hubspot.ui-extension.enabled=true. Generate a dedicated
      # 32-byte base64 key; do not reuse OAuth or credential-encryption keys.
      active-key-id: local-cursor-1
      active-key: __SET_LOCAL_BASE64_CURSOR_HMAC_KEY__
      # During rotation, keep one previous ID/key pair only until open cards
      # have restarted their result windows.
      previous-key-id:
      previous-key:
