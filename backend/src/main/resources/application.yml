spring:
  application:
    name: line-item-watch-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId:-} operationId=%X{operationId:-}] %logger{36} %kvp - %msg%n%wEx"

hubspot:
  oauth:
    client-id: ${HUBSPOT_OAUTH_CLIENT_ID}
    client-secret: ${HUBSPOT_OAUTH_CLIENT_SECRET}
    redirect-uri: ${HUBSPOT_OAUTH_REDIRECT_URI}
    api-base-url: ${HUBSPOT_API_BASE_URL:https://api.hubapi.com}
    authorization-base-url: ${HUBSPOT_AUTHORIZATION_BASE_URL:https://app.hubspot.com/oauth/authorize}
    connect-timeout: ${HUBSPOT_CONNECT_TIMEOUT:5s}
    read-timeout: ${HUBSPOT_READ_TIMEOUT:20s}
  webhook:
    enabled: ${HUBSPOT_WEBHOOK_ENABLED:false}
    public-uri: ${HUBSPOT_WEBHOOK_PUBLIC_URI:}
  ui-extension:
    enabled: ${HUBSPOT_UI_EXTENSION_ENABLED:false}
    public-base-uri: ${HUBSPOT_UI_EXTENSION_PUBLIC_BASE_URI:}
    app-id: ${HUBSPOT_UI_EXTENSION_APP_ID:}
  credentials:
    key-id: ${HUBSPOT_CREDENTIAL_KEY_ID}
    encryption-key: ${HUBSPOT_CREDENTIAL_ENCRYPTION_KEY}

line-item-watch:
  audit:
    cursor:
      active-key-id: ${LINE_ITEM_WATCH_AUDIT_CURSOR_ACTIVE_KEY_ID:}
      active-key: ${LINE_ITEM_WATCH_AUDIT_CURSOR_ACTIVE_KEY:}
      previous-key-id: ${LINE_ITEM_WATCH_AUDIT_CURSOR_PREVIOUS_KEY_ID:}
      previous-key: ${LINE_ITEM_WATCH_AUDIT_CURSOR_PREVIOUS_KEY:}
  processing:
    enabled: ${LINE_ITEM_WATCH_PROCESSING_ENABLED:false}
    poll-delay: ${LINE_ITEM_WATCH_PROCESSING_POLL_DELAY:1s}
    max-per-poll: ${LINE_ITEM_WATCH_PROCESSING_MAX_PER_POLL:50}
    lease-duration: ${LINE_ITEM_WATCH_PROCESSING_LEASE_DURATION:2m}
    max-attempts: ${LINE_ITEM_WATCH_PROCESSING_MAX_ATTEMPTS:8}
    base-backoff: ${LINE_ITEM_WATCH_PROCESSING_BASE_BACKOFF:5s}
    max-backoff: ${LINE_ITEM_WATCH_PROCESSING_MAX_BACKOFF:15m}
  reliability:
    enabled: ${LINE_ITEM_WATCH_RELIABILITY_ENABLED:false}
    poll-delay: ${LINE_ITEM_WATCH_RELIABILITY_POLL_DELAY:5s}
    schedule-delay: ${LINE_ITEM_WATCH_RELIABILITY_SCHEDULE_DELAY:1m}
    reconciliation-interval: ${LINE_ITEM_WATCH_RELIABILITY_RECONCILIATION_INTERVAL:6h}
    reconciliation-schedule-batch-size: ${LINE_ITEM_WATCH_RELIABILITY_RECONCILIATION_SCHEDULE_BATCH_SIZE:100}
    max-per-poll: ${LINE_ITEM_WATCH_RELIABILITY_MAX_PER_POLL:10}
    expansion-page-size: ${LINE_ITEM_WATCH_RELIABILITY_EXPANSION_PAGE_SIZE:100}
    lease-duration: ${LINE_ITEM_WATCH_RELIABILITY_LEASE_DURATION:5m}
    max-attempts: ${LINE_ITEM_WATCH_RELIABILITY_MAX_ATTEMPTS:6}
    base-backoff: ${LINE_ITEM_WATCH_RELIABILITY_BASE_BACKOFF:10s}
    max-backoff: ${LINE_ITEM_WATCH_RELIABILITY_MAX_BACKOFF:15m}
  operator:
    enabled: ${LINE_ITEM_WATCH_OPERATOR_ENABLED:false}
