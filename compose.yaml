services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: line_item_watch_local
      POSTGRES_USER: line_item_watch_local
      POSTGRES_PASSWORD: local_only_not_for_production
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - line_item_watch_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U line_item_watch_local -d line_item_watch_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  line_item_watch_postgres_data:
