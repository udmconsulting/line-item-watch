name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify backend, migrations, Testcontainers, and architecture
        run: ./backend/mvnw --batch-mode --no-transfer-progress -f backend/pom.xml verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/app/cards
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            assurance/package-lock.json
            src/app/cards/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run format:check

  hubspot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install --global @hubspot/cli@8.15.0
      - run: hs project lint --install-missing-deps=false --no-color

  ui-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            assurance/package-lock.json
            src/app/cards/package-lock.json
      - name: Install UI and assurance dependencies
        run: |
          npm --prefix src/app/cards ci
          npm --prefix assurance ci
          npm --prefix assurance exec -- playwright install --with-deps chromium
      - name: Verify assurance configuration and evidence sanitization
        run: npm --prefix assurance run test:config
      - name: Typecheck the shared journey and real-card harness
        run: npm --prefix assurance run typecheck
      - name: Run deterministic browser regression
        run: npm --prefix assurance test
      - name: Run owned-surface visual regression
        run: npm --prefix assurance run test:visual
      - name: Verify production synthetic container boundary
        run: |
          docker build \
            --file assurance/Dockerfile \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --build-arg BUILD_TIME=1970-01-01T00:00:00Z \
            --tag line-item-watch-assurance:ci .
          test "$(docker image inspect --format '{{.Config.User}}' line-item-watch-assurance:ci)" = pwuser
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' line-item-watch-assurance:ci)" = "${GITHUB_SHA}"
          test "$(docker image inspect --format '{{index .Config.Labels "com.udmconsulting.line-item-watch.image-type"}}' line-item-watch-assurance:ci)" = assurance
          if docker run --rm line-item-watch-assurance:ci; then
            echo "Synthetic runner unexpectedly accepted missing target configuration" >&2
            exit 1
          fi
      - name: Retain mock-only browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: deterministic-ui-assurance
          path: |
            assurance/playwright-report
            assurance/test-results
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: line_item_watch
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: container-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d line_item_watch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: >-
          docker build
          --build-arg "SOURCE_REVISION=${GITHUB_SHA}"
          --build-arg BUILD_TIME=1970-01-01T00:00:00Z
          --tag "line-item-watch:${GITHUB_SHA}" .
      - name: Verify Java 25 and minimal non-root runtime image
        run: |
          image_user=$(docker image inspect --format '{{.Config.User}}' "line-item-watch:${GITHUB_SHA}")
          test "$image_user" = "10001:10001"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "line-item-watch:${GITHUB_SHA}")" = "${GITHUB_SHA}"
          test "$(docker image inspect --format '{{index .Config.Labels "com.udmconsulting.line-item-watch.image-type"}}' "line-item-watch:${GITHUB_SHA}")" = application
          docker run --rm --entrypoint java "line-item-watch:${GITHUB_SHA}" -version 2>&1 | grep 'version "25\.'
          docker run --rm --entrypoint sh "line-item-watch:${GITHUB_SHA}" -c '
            test "$(id -u)" = 10001
            ! command -v javac
            ! command -v mvn
            test ! -d /workspace
            test ! -e /opt/app/src
          '
      - name: Run migration role against PostgreSQL 18
        run: |
          docker run --rm --network host \
            -e APPLICATION_RUNTIME_ROLE=MIGRATE \
            -e DATABASE_URL=jdbc:postgresql://localhost:5432/line_item_watch \
            -e DATABASE_USERNAME=postgres \
            -e DATABASE_PASSWORD=container-test-only \
            -e HUBSPOT_OAUTH_CLIENT_ID=container-test \
            -e HUBSPOT_OAUTH_CLIENT_SECRET=container-test-only \
            -e HUBSPOT_OAUTH_REDIRECT_URI=http://localhost:8080/integrations/hubspot/oauth/callback \
            -e HUBSPOT_CREDENTIAL_KEY_ID=container-key-1 \
            -e HUBSPOT_CREDENTIAL_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            "line-item-watch:${GITHUB_SHA}"
      - name: Migration and operator failures exit non-zero
        run: |
          if docker run --rm --network host \
            -e APPLICATION_RUNTIME_ROLE=MIGRATE \
            -e DATABASE_URL=jdbc:postgresql://localhost:5432/line_item_watch \
            -e DATABASE_USERNAME=postgres \
            -e DATABASE_PASSWORD=deliberately-wrong \
            "line-item-watch:${GITHUB_SHA}"; then
            echo "MIGRATE unexpectedly succeeded with invalid credentials" >&2
            exit 1
          fi
          if docker run --rm --network host \
            -e APPLICATION_RUNTIME_ROLE=OPERATOR \
            -e DATABASE_URL=jdbc:postgresql://localhost:5432/line_item_watch \
            -e DATABASE_USERNAME=postgres \
            -e DATABASE_PASSWORD=container-test-only \
            -e HUBSPOT_OAUTH_CLIENT_ID=container-test \
            -e HUBSPOT_OAUTH_CLIENT_SECRET=container-test-only \
            -e HUBSPOT_OAUTH_REDIRECT_URI=http://localhost:8080/integrations/hubspot/oauth/callback \
            -e HUBSPOT_CREDENTIAL_KEY_ID=container-key-1 \
            -e HUBSPOT_CREDENTIAL_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            "line-item-watch:${GITHUB_SHA}"; then
            echo "OPERATOR unexpectedly succeeded without a command" >&2
            exit 1
          fi
      - name: Start service role on PORT and verify health groups
        run: |
          docker run --detach --name liw-smoke --network host \
            -e PORT=18080 \
            -e APPLICATION_RUNTIME_ROLE=SERVICE \
            -e DATABASE_URL=jdbc:postgresql://localhost:5432/line_item_watch \
            -e DATABASE_USERNAME=postgres \
            -e DATABASE_PASSWORD=container-test-only \
            -e HUBSPOT_OAUTH_CLIENT_ID=container-test \
            -e HUBSPOT_OAUTH_CLIENT_SECRET=container-test-only \
            -e HUBSPOT_OAUTH_REDIRECT_URI=http://localhost:18080/integrations/hubspot/oauth/callback \
            -e HUBSPOT_CREDENTIAL_KEY_ID=container-key-1 \
            -e HUBSPOT_CREDENTIAL_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            "line-item-watch:${GITHUB_SHA}"
          for _ in $(seq 1 60); do
            if curl --fail --silent http://localhost:18080/actuator/health/liveness >/dev/null \
              && curl --fail --silent http://localhost:18080/actuator/health/readiness >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs liw-smoke
          exit 1
      - name: Gracefully stop smoke container
        if: always()
        run: |
          if docker inspect liw-smoke >/dev/null 2>&1; then
            docker stop --time 25 liw-smoke
            test "$(docker inspect --format '{{.State.Running}}' liw-smoke)" = false
            docker logs liw-smoke 2>&1 | grep -q "Graceful shutdown complete"
            docker rm liw-smoke
          fi

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive infra
      - name: Verify project and lifecycle contracts
        run: bash infra/tests/verify-contracts.sh
      - name: Verify canonical operations and workflow safety contracts
        run: bash scripts/tests/automation-contracts.sh
      - name: Test environment module contracts with a mocked provider
        working-directory: infra/modules/environment
        run: terraform init -backend=false && terraform test
      - name: Validate staging without remote state or credentials
        working-directory: infra/staging
        run: terraform init -backend=false && terraform validate
      - name: Validate production without remote state or credentials
        working-directory: infra/production
        run: terraform init -backend=false && terraform validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/app/cards/package-lock.json
      - name: Backend dependency audit
        run: >-
          ./backend/mvnw --batch-mode --no-transfer-progress -f backend/pom.xml
          -Pdependency-audit org.owasp:dependency-check-maven:check
      - name: Frontend production runtime audit
        working-directory: src/app/cards
        run: npm audit --omit=dev --audit-level=high
      - name: Browser synthetic production runtime audit
        working-directory: assurance
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.29.1
        with:
          args: detect --source=/github/workspace --redact --verbose
