name: Promote production

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character Git SHA recorded with staging acceptance
        required: true
        type: string
      staging_digest:
        description: Staging-accepted application sha256 digest
        required: true
        type: string
      staging_synthetic_digest:
        description: Staging-accepted assurance sha256 digest
        required: true
        type: string
      run_migrations:
        description: Run production migrations before traffic promotion
        required: true
        default: true
        type: boolean
      verify:
        description: Require readiness and the read-only production synthetic
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    uses: ./.github/workflows/_promote-production.yml
    with:
      revision: ${{ inputs.revision }}
      staging_digest: ${{ inputs.staging_digest }}
      staging_synthetic_digest: ${{ inputs.staging_synthetic_digest }}
      run_migrations: ${{ inputs.run_migrations }}
      verify: ${{ inputs.verify }}
