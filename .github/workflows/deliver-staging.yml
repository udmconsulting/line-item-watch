name: Deliver staging

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character Git SHA selected from main
        required: true
        type: string
      artifact_only:
        description: Publish immutable artifacts without touching the provisioned runtime
        required: true
        default: false
        type: boolean
      run_migrations:
        description: Run the migration job before a full staging deployment
        required: true
        default: true
        type: boolean
      verify:
        description: Require readiness and the protected real HubSpot journey
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deliver:
    uses: ./.github/workflows/_deliver-staging.yml
    with:
      revision: ${{ inputs.revision }}
      artifact_only: ${{ inputs.artifact_only }}
      run_migrations: ${{ inputs.run_migrations }}
      verify: ${{ inputs.verify }}
